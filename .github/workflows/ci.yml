name: CI

on:
  pull_request:
    branches: [dev, test, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/WorkMates
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw   # Windows submitting may result in the loss of the executable bit
      - run: ./mvnw -B -ntp test # -B batch mode, disable interaction -ntp do not display download progress
      # Upload JaCoCo coverage report for inspection
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/WorkMates/target/site/jacoco/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint    # ESLint Checks
      - run: npm run build   # Includes TSC type checking
