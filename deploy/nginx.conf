# Inside the frontend container: static files and SPA fallback only.
# /api is split off by the host Nginx before a request gets here.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA routes: any path that is not a file falls back to index.html
    location / { try_files $uri /index.html; }

    # index.html names the hashed JS/CSS files, so it must be re-fetched after each deploy
    location = /index.html { add_header Cache-Control "no-cache"; }
}
